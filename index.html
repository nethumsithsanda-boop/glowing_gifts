<title>Business POS</title>
<style>
:root{--primary:#c33c9f;--bg:#f5f6fa;--card:#fff;--ink:#242334;--muted:#77788b;--line:#e8e8ef;--danger:#c0394b;--green:#198754}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;background:var(--primary);color:#fff;font-weight:600}button:disabled{opacity:.5;cursor:wait}.secondary{background:#eeeef4;color:#333}.danger{background:#b72f44}.success{background:#168653}.wrap{display:flex;min-height:100vh}.side{width:220px;background:#fff;border-right:1px solid var(--line);padding:20px 12px;flex-shrink:0}.brand{font-size:19px;font-weight:bold;margin:4px 8px 20px;overflow-wrap:anywhere}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:normal;margin-top:6px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#555;text-align:left;font-weight:500}.nav button.active,.nav button:hover{background:#f7e8f3;color:var(--primary)}main{flex:1;min-width:0;padding:22px;max-width:1600px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.top h1{font-size:24px;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:15px;min-width:0}.metric{font-size:25px;font-weight:bold;margin:10px 0 4px;overflow-wrap:anywhere}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.toolbar input,.toolbar select{flex:1;min-width:140px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-weight:600;font-size:12px}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:10px;border:1px solid #dcdce5;border-radius:7px;background:white;color:var(--ink)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.wide{grid-column:1/-1}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-size:12px;background:#fafafd}td button{margin:2px;padding:7px 9px;font-size:12px}.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#f7e8f3;color:var(--primary);font-size:12px}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{border:1px solid var(--line);border-radius:10px;padding:12px;background:white;min-width:0}.product img{width:100%;height:105px;object-fit:contain;border-radius:6px}.product h3{font-size:14px;margin:8px 0;overflow-wrap:anywhere}.product button{width:100%;margin-top:8px}.posgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:15px}.cartrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.cartrow strong{display:block;overflow-wrap:anywhere}.qty{display:flex;gap:5px;align-items:center;margin-top:7px}.qty button{padding:5px 9px}.totalrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0}.totalrow.grand{font-size:20px;font-weight:bold;border-top:1px solid var(--line);margin-top:7px;padding-top:14px}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:28px}.toast{position:fixed;bottom:20px;right:20px;z-index:100;background:#222;color:white;padding:14px 18px;border-radius:9px;max-width:90vw;box-shadow:0 4px 20px #0002}.toast.error{background:#9c2637}.modal{position:fixed;inset:0;z-index:50;background:#0006;display:grid;place-items:center;padding:15px}.modalbox{background:white;border-radius:12px;padding:20px;width:min(600px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h2{margin:0;font-size:19px}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:13px;background:#fff4d7;border-radius:8px;margin-bottom:14px}.status{font-size:12px}.settingsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.checkrow{display:flex;gap:8px;align-items:center;margin:10px 0}.checkrow input{width:auto}.logo{width:42px;height:42px;object-fit:contain;border-radius:6px}.reportbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.reportbar>*{flex:1;min-width:135px}
@media(max-width:900px){.side{width:175px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.posgrid{grid-template-columns:1fr}}
@media(max-width:600px){.wrap{display:block}.side{width:100%;padding:10px;border:0;border-bottom:1px solid var(--line)}.brand{margin:4px 6px 10px}.nav{display:flex;overflow-x:auto;gap:5px}.nav button{white-space:nowrap;padding:10px}.nav button.active{background:#f7e8f3}main{padding:13px}.top h1{font-size:20px}.grid{gap:8px}.card{padding:12px}.metric{font-size:20px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.product{padding:8px}.product img{height:80px}.formgrid,.settingsgrid{grid-template-columns:1fr}.wide{grid-column:auto}.modalbox{padding:15px}.checkoutsticky{position:sticky;bottom:5px;box-shadow:0 -3px 16px #0001}}
@media print{body{background:white}.side,.top,.noprint,.toast{display:none!important}main{padding:0;max-width:none}.wrap{display:block}.receipt-print{display:block!important}.card{border:0;padding:0}.modal{position:static;background:white;padding:0}.modalbox{width:100%;max-height:none;border:0;padding:0}.receipt-print table{min-width:0}.receipt-print th,.receipt-print td{padding:6px 2px;font-size:11px}}

/* Dribbble-inspired blue-and-white POS presentation */
:root{--primary:#3979e8;--bg:#f8fafd;--card:#fff;--ink:#1d2635;--muted:#8993a5;--line:#e9eef5;--green:#1b9a6d}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.wrap{max-width:1600px;margin:auto;background:#fff;min-height:100vh}.side{width:226px;padding:22px 15px;border-right:1px solid #edf0f6}.brand{font-size:19px;letter-spacing:-.6px;margin-bottom:32px}.brand:before{content:'◕';display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e8f1ff;color:#3778e8;margin-right:9px;font-size:23px;vertical-align:middle}.brand small{padding-left:46px;margin-top:-2px;letter-spacing:0}
.nav{gap:7px}.nav button{border-radius:7px;padding:12px 14px;font-size:13px;color:#677489}.nav button.active,.nav button:hover{background:#3d7de8;color:white;box-shadow:0 4px 12px #3979e82c}
main{padding:28px 28px 60px;background:#fff}.top{padding-bottom:18px;border-bottom:1px solid #eef1f6;margin-bottom:22px}.top h1{font-size:22px;letter-spacing:-.5px}.pill{background:#eaf8f1;color:#16845a;font-weight:650}.card{border:1px solid #edf0f5;box-shadow:0 4px 16px #253d6110;border-radius:13px}.grid{gap:12px}.metric{font-size:23px;letter-spacing:-.6px}button{border-radius:8px;background:#3979e8}button:hover:not(:disabled){filter:brightness(.97)}.secondary{background:#f2f6ff;color:#4773bc}.success{background:#3979e8}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border-color:#e7edf6;background:#fff;min-height:39px}.products{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.product{border:1px solid #e9eef7;border-radius:12px;box-shadow:0 3px 12px #1c38610b;padding:12px}.product img{height:118px;object-fit:cover;border-radius:9px;background:#f5f7fc}.product h3{font-size:13px;line-height:1.35}.product button{font-size:12px}.posgrid{grid-template-columns:minmax(0,1.65fr) minmax(290px,.85fr);align-items:start}.pos-main{min-width:0}.section-title{font-size:19px;font-weight:750;letter-spacing:-.4px;margin:3px 0 15px}.orderline{margin-bottom:23px}.orderline-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.orderline-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.order-mini{border:1px solid #e9eef5;border-radius:12px;padding:13px;background:#fff;box-shadow:0 3px 10px #253d6108}.order-mini .order-top{display:flex;justify-content:space-between;gap:6px}.order-mini strong{font-size:12px}.order-mini small{color:#8893a4;font-size:10px}.order-mini .ready{color:#139a6b;background:#e9f8f0;padding:4px 7px;border-radius:12px}.order-mini .order-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.order-mini button{font-size:11px;padding:7px 10px}.category-chips{display:flex;gap:8px;overflow:auto;padding:4px 0 15px}.category-chips button{white-space:nowrap;background:#fff;color:#7a879a;border:1px solid #e8eef8;padding:8px 12px;font-weight:500}.category-chips button.selected{color:#3979e8;border-color:#3979e8;background:#eef5ff}.pos-products-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.pos-products-heading h2{margin:0;font-size:19px}.pos-product-list{border-top:1px solid #edf0f6;padding-top:16px}.checkoutsticky{position:sticky;top:18px}.cartrow .qty button{background:#edf4ff;color:#3979e8}.modalbox{box-shadow:0 20px 70px #192f4650}
@media(max-width:1050px){.orderline-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.posgrid{grid-template-columns:1fr}.checkoutsticky{position:static}}
@media(max-width:650px){.side{width:100%;padding:12px}.brand{margin:4px 6px 12px}.brand small{padding-left:0;margin-top:5px}.nav button{padding:10px}.nav button.active{background:#3979e8;color:#fff}main{padding:15px}.orderline-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.order-mini{padding:10px}.order-mini:nth-child(n+3){display:none}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.product img{height:100px}.posgrid{gap:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.orderline,.category-chips{display:none!important}}
</style>

<body>
<div class="wrap">
<aside class="side">
<div class="brand" id="brand">Business POS<small id="brandSub">Connecting…</small></div>
<div class="nav" id="nav">
<button data-page="dashboard" class="active">◫ Overview</button>
<button data-page="pos">▣ Order Process</button>
<button data-page="products">▤ Products</button>
<button data-page="categories">▦ Categories</button>
<button data-page="customers">♙ Customers</button>
<button data-page="sales">▤ Sales History</button>
<button data-page="expenses">− Expenses</button>
<button data-page="reports">▥ Reports</button>
<button data-page="assistant">✦ AI Assistant</button>
<button data-page="settings">⚙ Settings</button>
</div>
<div class="muted status" style="margin:18px 8px" id="connection">Connecting to database…</div>
</aside>
<main>
<div class="top"><h1 id="pageTitle">Dashboard</h1><span class="pill" id="today"></span></div>
<div id="app"><div class="card empty">Connecting to Google Sheets…</div></div>
</main>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Edit</h2><button class="secondary" id="modalClose" aria-label="Close">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzztMpYYebej91zQYDTTOAy3wn_Kw8cot7c39fzCNS85BqgCsvl1BxJ050admv360UL/exec";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={settings:{},products:[],categories:[],customers:[],sales:[],expenses:[],dashboard:{},cart:[],page:"dashboard",lastSale:null,editing:null};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>Number(v)||0;
const money=v=>{const s=state.settings.currencySymbol||state.settings.currency||"";return s+" "+num(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})};
const dateNow=()=>new Date().toISOString().slice(0,10);
const fmtDate=v=>v?new Date(v).toLocaleString():"—";
const toast=(m,err=false)=>{const t=$("#toast");t.textContent=m;t.className="toast"+(err?" error":"");setTimeout(()=>t.classList.add("hidden"),3800)};
const call=(action,payload={})=>new Promise((resolve,reject)=>{
 if(!GOOGLE_SCRIPT_URL||GOOGLE_SCRIPT_URL.includes("PASTE_YOUR"))return reject(Error("Set GOOGLE_SCRIPT_URL to your deployed Apps Script /exec URL."));
 const cb="poscb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
 const script=document.createElement("script");let timer;
 const cleanup=()=>{clearTimeout(timer);delete window[cb];script.remove()};
 window[cb]=r=>{cleanup();r&&r.success?resolve(r.data):reject(Error(r?.error||"Request failed."))};
 script.onerror=()=>{cleanup();reject(Error("Could not connect to Apps Script. Check deployment and URL."))};
 const q=new URLSearchParams({action, payload:JSON.stringify(payload),callback:cb});
 script.src=GOOGLE_SCRIPT_URL+(GOOGLE_SCRIPT_URL.includes("?")?"&":"?")+q.toString();
 timer=setTimeout(()=>{cleanup();reject(Error("Request timed out. Check your Apps Script deployment."))},25000);
 document.head.appendChild(script);
});
async function refresh(){
 const [settings,products,categories,customers,sales,expenses,dashboard]=await Promise.all([
 call("getSettings"),call("getProducts"),call("getCategories"),call("getCustomers"),call("getSales"),call("getExpenses"),call("getDashboardData")
 ]);
 state.settings=settings||{};state.products=products||[];state.categories=categories||[];state.customers=customers||[];state.sales=sales||[];state.expenses=expenses||[];state.dashboard=dashboard||{};
 document.documentElement.style.setProperty("--primary","#3979e8");
 document.title=(state.settings.businessName||"Business")+" POS";
 $("#brand").innerHTML=esc(state.settings.businessName||"Business")+" POS<small id='brandSub'>"+esc(state.settings.businessCategory||"Store")+"</small>";
 $("#connection").textContent="● Connected to Google Sheets";$("#connection").style.color="var(--green)";
 $("#today").textContent=new Date().toLocaleDateString();
 render();
}
function go(page){state.page=page;$$("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("#pageTitle").textContent=({dashboard:"Dashboard",pos:"POS / Checkout",products:"Products",categories:"Categories",customers:"Customers",sales:"Sales History",expenses:"Expenses",reports:"Reports",settings:"Settings",assistant:"AI Business Assistant"})[page]||page;render()}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)go(b.dataset.page)});
$("#modalClose").onclick=closeModal;
$("#modal").addEventListener("click",e=>{if(e.target===$("#modal"))closeModal()});
function openModal(title,html){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=html;$("#modal").classList.remove("hidden")}
function closeModal(){$("#modal").classList.add("hidden");state.editing=null}
function field(label,name,value="",type="text",extra=""){return `<div class="field"><label for="${esc(name)}">${esc(label)}</label><input id="${esc(name)}" name="${esc(name)}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,options,value=""){return `<div class="field"><label for="${name}">${esc(label)}</label><select id="${name}" name="${name}">${options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?"selected":""}>${esc(o.label)}</option>`).join("")}</select></div>`}
function formButtons(text="Save"){return `<div class="actions"><button type="submit">${esc(text)}</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div>`}
function showForm(title,fields,onSave){openModal(title,`<form id="editForm"><div class="formgrid">${fields}</div>${formButtons()}</form>`);$("#editForm").onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{await onSave(data);closeModal();await refresh();toast("Saved successfully.")}catch(err){toast(err.message,true)}finally{btn.disabled=false}}}
function empty(msg){return `<div class="empty">${esc(msg)}</div>`}
function table(headers,rows){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`:empty("No records found.")}
function metric(label,value,sub=""){return `<div class="card"><div class="muted">${esc(label)}</div><div class="metric">${esc(value)}</div><div class="muted">${esc(sub)}</div></div>`}
function actions(edit,del){return `<div class="actions"><button class="secondary" onclick="${edit}">Edit</button><button class="danger" onclick="${del}">Delete</button></div>`}
function render(){const fn=({dashboard:dashboardPage,pos:posPage,products:productsPage,categories:categoriesPage,customers:customersPage,sales:salesPage,expenses:expensesPage,reports:reportsPage,settings:settingsPage,assistant:assistantPage})[state.page]||dashboardPage;$("#app").innerHTML=fn()}
function dashboardPage(){const d=state.dashboard;return `<div class="grid">${metric("Today's sales",money(d.todaySales),"Completed sales")}${metric("Today's orders",d.todayOrders||0,"Invoices")}${metric("Total products",d.totalProducts||0,"Active products")}${metric("Low stock",d.lowStockCount||0,"At or below stock limit")}${metric("Customers",d.totalCustomers||0,"Customer records")}${metric("Today's expenses",money(d.todayExpenses),"Recorded expenses")}${metric("Estimated profit",money(d.estimatedProfit),"Sales − sold-item cost − expenses")}</div><div class="card"><h3>Low stock alerts</h3>${table(["Product","SKU","Stock","Limit"],(d.lowStockProducts||[]).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td><span class="pill">${esc(p.stock)}</span></td><td>${esc(p.lowStockLimit)}</td></tr>`))}</div><div class="card"><h3>Recent sales</h3>${table(["Invoice","Date","Customer","Total","Payment"],state.sales.slice(-8).reverse().map(s=>`<tr><td>${esc(s.invoiceId)}</td><td>${esc(fmtDate(s.date))}</td><td>${esc(s.customerName||"Walk-in")}</td><td>${money(s.total)}</td><td>${esc(s.paymentMethod)}</td></tr>`))}</div>`}
function productFilter(){return `<select id="pCategory"><option value="">All categories</option>${state.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select>`}
function productsPage(){return `<div class="card"><div class="toolbar"><input id="pSearch" placeholder="Search product, SKU or barcode"><button onclick="productForm()">+ Add product</button>${productFilter()}</div><div id="productTable">${productRows(state.products)}</div></div>`}
function productRows(list){return table(["Product","SKU / Barcode","Category","Price","Cost","Stock","Actions"],list.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}<br>${esc(p.barcode)}</td><td>${esc(p.categoryName)}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${esc(p.stock)} ${num(p.stock)<=num(p.lowStockLimit)?'<span class="pill">Low</span>':""}</td><td><button class="secondary" onclick="productForm('${esc(p.id)}')">Edit</button><button class="danger" onclick="deleteProduct('${esc(p.id)}')">Delete</button></td></tr>`))}
function bindProductSearch(){const run=()=>{const q=$("#pSearch").value.toLowerCase(),c=$("#pCategory").value;$("#productTable").innerHTML=productRows(state.products.filter(p=>(!c||p.categoryId===c)&&[p.name,p.sku,p.barcode,p.categoryName].some(v=>String(v||"").toLowerCase().includes(q))))};$("#pSearch").oninput=run;$("#pCategory").onchange=run}
const oldRender=render;
render=function(){oldRender();if(state.page==="products")bindProductSearch();if(state.page==="pos")bindPosFilters();if(state.page==="customers")bindCustomerSearch();if(state.page==="sales")bindSalesFilter();if(state.page==="expenses")bindExpenseFilter()};
function productForm(id=""){const p=state.products.find(x=>x.id===id)||{};showForm(id?"Edit product":"Add product",field("Product name","name",p.name)+field("SKU","sku",p.sku)+field("Barcode","barcode",p.barcode)+selectField("Category","categoryId",[{value:"",label:"No category"},...state.categories.map(c=>({value:c.id,label:c.name}))],p.categoryId)+field("Selling price","price",p.price??0,"number",'min="0" step="0.01" required')+field("Cost price","cost",p.cost??0,"number",'min="0" step="0.01" required')+field("Stock quantity","stock",p.stock??0,"number",'min="0" step="1" required')+field("Low stock limit","lowStockLimit",p.lowStockLimit??5,"number",'min="0" step="1" required')+field("Image URL","imageUrl",p.imageUrl||"","url")+`<div class="field wide"><label class="checkrow"><input type="checkbox" name="active" ${p.active===false?"":"checked"}> Active</label></div>`,async d=>call(id?"updateProduct":"saveProduct",{...d,id,price:Number(d.price),cost:Number(d.cost),stock:Number(d.stock),lowStockLimit:Number(d.lowStockLimit),active:d.active==="on"}))}
async function deleteProduct(id){if(confirm("Delete this product? It will be deactivated if already used in sales.")){try{await call("deleteProduct",{id});await refresh();toast("Product deleted.")}catch(e){toast(e.message,true)}}}
function categoriesPage(){return `<div class="card"><div class="toolbar"><button onclick="categoryForm()">+ Add category</button></div>${table(["Name","Description","Status","Actions"],state.categories.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.description)}</td><td>${c.active?"Active":"Inactive"}</td><td><button class="secondary" onclick="categoryForm('${esc(c.id)}')">Edit</button><button class="danger" onclick="deleteCategory('${esc(c.id)}')">Delete</button></td></tr>`))}</div>`}
function categoryForm(id=""){const c=state.categories.find(x=>x.id===id)||{};showForm(id?"Edit category":"Add category",field("Name","name",c.name,"text","required")+field("Description","description",c.description)+`<div class="field wide"><label class="checkrow"><input type="checkbox" name="active" ${c.active===false?"":"checked"}> Active</label></div>`,d=>call("saveCategory",{...d,id,active:d.active==="on"}))}
async function deleteCategory(id){if(confirm("Delete this category?"))try{await call("deleteCategory",{id});await refresh();toast("Category deleted.")}catch(e){toast(e.message,true)}}
function customersPage(){return `<div class="card"><div class="toolbar"><input id="cSearch" placeholder="Search customers"><button onclick="customerForm()">+ Add customer</button></div><div id="customerTable">${customerRows(state.customers)}</div></div>`}
function customerRows(list){return table(["Name","Phone","Email","Address","Purchase history","Actions"],list.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${esc(c.address)}</td><td><button class="secondary" onclick="customerHistory('${esc(c.id)}')">View sales</button></td><td><button class="secondary" onclick="customerForm('${esc(c.id)}')">Edit</button></td></tr>`))}
function bindCustomerSearch(){const run=()=>{const q=$("#cSearch").value.toLowerCase();$("#customerTable").innerHTML=customerRows(state.customers.filter(c=>[c.name,c.phone,c.email].some(v=>String(v||"").toLowerCase().includes(q))))};$("#cSearch").oninput=run}
function customerForm(id=""){const c=state.customers.find(x=>x.id===id)||{};showForm(id?"Edit customer":"Add customer",field("Name","name",c.name,"text","required")+field("Phone","phone",c.phone)+field("Email","email",c.email,"email")+`<div class="field wide"><label>Address</label><textarea name="address" rows="3">${esc(c.address||"")}</textarea></div>`,d=>call("saveCustomer",{...d,id}))}
function customerHistory(id){const c=state.customers.find(x=>x.id===id);const rows=state.sales.filter(s=>s.customerId===id);openModal("Purchase history — "+(c?.name||""),table(["Invoice","Date","Total","Payment"],rows.map(s=>`<tr><td>${esc(s.invoiceId)}</td><td>${esc(fmtDate(s.date))}</td><td>${money(s.total)}</td><td>${esc(s.paymentMethod)}</td></tr>`)))}
function posPage(){const recent=state.sales.slice(-3).reverse();return `<div class="orderline"><div class="orderline-head"><h2 class="section-title">Order Line</h2><button class="secondary" onclick="go('sales')">Recent Orders →</button></div><div class="orderline-grid">${recent.length?recent.map(s=>`<div class="order-mini"><div class="order-top"><div><strong>${esc(s.invoiceId)}</strong><br><small>${esc(fmtDate(s.date))}</small></div><span class="ready">Completed</span></div><div class="order-bottom"><small>${esc(s.itemCount)} items · ${money(s.total)}</small><button onclick="reprintSale('${esc(s.id)}')">View ↗</button></div></div>`).join(""):'<div class="order-mini muted">No recent orders yet. Complete a sale to see it here.</div>'}</div></div><div class="posgrid"><section class="pos-main"><div class="card"><div class="pos-products-heading"><h2>Menu</h2><span class="muted">${state.products.filter(p=>p.active!==false).length} products</span></div><div class="toolbar"><input id="posSearch" aria-label="Search products" placeholder="⌕ Search products, SKU or barcode"><select id="posCategory" aria-label="Filter category"><option value="">All categories</option>${state.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></div><div class="category-chips" id="posChips"><button class="selected" data-cat="">All</button>${state.categories.filter(c=>c.active!==false).map(c=>`<button data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join("")}</div><div class="pos-product-list"><div id="posProducts" class="products">${productCards(state.products.filter(p=>p.active!==false))}</div></div></div></section><section><div class="card checkoutsticky"><h3>Current Order</h3><div id="cartItems">${cartRows()}</div><div class="field"><label>Customer (optional)</label><select id="cartCustomer"><option value="">Walk-in customer</option>${state.customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} — ${esc(c.phone)}</option>`).join("")}</select></div><div class="field"><label>Discount (amount)</label><input id="cartDiscount" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Payment method</label><select id="cartPayment"><option>Cash</option><option>Card</option><option>Bank Transfer</option><option>Other</option></select></div><div id="cartTotals">${cartTotals()}</div><div class="actions"><button class="secondary" onclick="clearCart()">Clear cart</button><button id="checkoutBtn" class="success" onclick="checkout()" style="flex:1">Complete sale</button></div></div></section></div>`}

function productCards(list){return list.map(p=>`<div class="product">${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">`:""}<h3>${esc(p.name)}</h3><div class="muted">${esc(p.sku||p.barcode||"No SKU")}</div><p><strong>${money(p.price)}</strong> · Stock ${esc(p.stock)}</p><button onclick="addCart('${esc(p.id)}')" ${num(p.stock)<=0?"disabled":""}>Add to cart</button></div>`).join("")||empty("No matching products.")}
function bindPosFilters(){const run=()=>{const q=$("#posSearch").value.toLowerCase(),c=$("#posCategory").value;$("#posProducts").innerHTML=productCards(state.products.filter(p=>p.active!==false&&(!c||p.categoryId===c)&&[p.name,p.sku,p.barcode].some(v=>String(v||"").toLowerCase().includes(q))))};$("#posSearch").oninput=run;$("#posCategory").onchange=()=>{run();document.querySelectorAll("#posChips [data-cat]").forEach(b=>b.classList.toggle("selected",b.dataset.cat===$("#posCategory").value))};$("#posChips").onclick=e=>{const b=e.target.closest("[data-cat]");if(b){$("#posCategory").value=b.dataset.cat;$("#posCategory").onchange()}};$("#cartDiscount").oninput=()=>$("#cartTotals").innerHTML=cartTotals()}
function cartRows(){return state.cart.map(i=>`<div class="cartrow"><div><strong>${esc(i.name)}</strong><div class="muted">${money(i.price)} each</div><div class="qty"><button class="secondary" onclick="changeQty('${esc(i.id)}',-1)">−</button><span>${i.quantity}</span><button class="secondary" onclick="changeQty('${esc(i.id)}',1)" ${i.quantity>=num(i.stock)?"disabled":""}>+</button><button class="danger" onclick="removeCart('${esc(i.id)}')">×</button></div></div><strong>${money(i.price*i.quantity)}</strong></div>`).join("")||empty("Add products to begin.")}
function cartTotals(){const sub=state.cart.reduce((a,i)=>a+i.price*i.quantity,0),discount=Math.min(sub,Math.max(0,num($("#cartDiscount")?.value))),tax=state.settings.taxEnabled?Math.max(0,(sub-discount)*num(state.settings.taxRate)/100):0;return `<div class="totalrow"><span>Subtotal</span><span>${money(sub)}</span></div><div class="totalrow"><span>Discount</span><span>− ${money(discount)}</span></div><div class="totalrow"><span>Tax</span><span>${money(tax)}</span></div><div class="totalrow grand"><span>Total</span><span>${money(sub-discount+tax)}</span></div>`}
function addCart(id){const p=state.products.find(x=>x.id===id);if(!p)return;const i=state.cart.find(x=>x.id===id);if(i){if(i.quantity>=num(p.stock))return toast("Not enough stock.",true);i.quantity++}else{if(num(p.stock)<1)return toast("Out of stock.",true);state.cart.push({id:p.id,name:p.name,price:num(p.price),cost:num(p.cost),stock:num(p.stock),quantity:1})}$("#cartItems").innerHTML=cartRows();$("#cartTotals").innerHTML=cartTotals()}
function changeQty(id,n){const i=state.cart.find(x=>x.id===id);if(!i)return;i.quantity+=n;if(i.quantity<1)state.cart=state.cart.filter(x=>x.id!==id);else if(i.quantity>i.stock){i.quantity=i.stock;toast("Stock limit reached.",true)}$("#cartItems").innerHTML=cartRows();$("#cartTotals").innerHTML=cartTotals()}
function removeCart(id){state.cart=state.cart.filter(x=>x.id!==id);$("#cartItems").innerHTML=cartRows();$("#cartTotals").innerHTML=cartTotals()}
function clearCart(){if(!state.cart.length)return;if(confirm("Clear this cart?")){state.cart=[];$("#cartItems").innerHTML=cartRows();$("#cartTotals").innerHTML=cartTotals()}}
async function checkout(){if(!state.cart.length)return toast("Add at least one product.",true);const btn=$("#checkoutBtn");btn.disabled=true;try{const data=await call("createSale",{items:state.cart.map(i=>({productId:i.id,quantity:i.quantity})),customerId:$("#cartCustomer").value,discount:num($("#cartDiscount").value),paymentMethod:$("#cartPayment").value});state.cart=[];await refresh();state.lastSale=data;showReceipt(data);toast("Sale saved: "+data.sale.invoiceId)}catch(e){toast(e.message,true)}finally{const b=$("#checkoutBtn");if(b)b.disabled=false}}
function showReceipt(data){openModal("Sale completed",receiptHtml(data)+`<div class="actions noprint" style="margin-top:18px"><button onclick="printReceipt()">Print receipt</button><button class="secondary" onclick="closeModal()">Done</button></div>`)}
function receiptHtml(d){const s=state.settings,a=d.sale,items=d.items||[];return `<div id="receipt" class="receipt-print"><div style="text-align:center;padding:8px 0">${s.receiptShowLogo&&s.logo?`<img src="${esc(s.logo)}" alt="Logo" style="max-width:95px;max-height:75px;object-fit:contain">`:""}<h2>${esc(s.businessName||"Business")}</h2><div>${esc(s.businessCategory||"")}</div>${s.receiptShowAddress?`<div>${esc(s.address||"")} ${esc(s.city||"")} ${esc(s.country||"")}</div>`:""}${s.receiptShowPhone?`<div>${esc(s.phone||"")}</div>`:""}${s.receiptShowEmail?`<div>${esc(s.email||"")}</div>`:""}</div><hr><div>Invoice: ${esc(a.invoiceId)}</div><div>Date: ${esc(fmtDate(a.date))}</div><div>Customer: ${esc(a.customerName||"Walk-in")}</div><table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.productName)}</td><td>${esc(i.quantity)}</td><td>${money(i.unitPrice)}</td><td>${money(i.lineTotal)}</td></tr>`).join("")}</tbody></table><div class="totalrow"><span>Subtotal</span><span>${money(a.subtotal)}</span></div><div class="totalrow"><span>Discount</span><span>− ${money(a.discount)}</span></div><div class="totalrow"><span>Tax</span><span>${money(a.tax)}</span></div><div class="totalrow grand"><span>Total</span><span>${money(a.total)}</span></div><p>Payment: ${esc(a.paymentMethod)}</p><p style="text-align:center;margin-top:20px">${esc(s.receiptFooter||"Thank you")}</p></div>`}
function printReceipt(){const r=$("#receipt");if(!r)return;const w=window.open("","_blank","width=500,height=750");if(!w){toast("Allow pop-ups to print the receipt.",true);return}w.document.write("<!doctype html><html><head><title>Receipt</title><style>body{font:13px Arial;padding:18px;color:#111}h2{text-align:center}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:7px 2px}.totalrow{display:flex;justify-content:space-between;padding:6px 0}.grand{font-size:17px;font-weight:bold;border-top:1px solid #ccc}img{max-width:95px;max-height:75px}</style></head><body>"+r.outerHTML+"</body></html>");w.document.close();w.focus();setTimeout(()=>{w.print()},500)}
function salesPage(){return `<div class="card"><div class="toolbar"><input type="date" id="salesFrom" value="${dateNow()}"><input type="date" id="salesTo" value="${dateNow()}"><input id="salesSearch" placeholder="Invoice or customer"><button onclick="downloadSales()">Export CSV</button></div><div id="salesTable">${salesRows(state.sales)}</div></div>`}
function salesRows(list){return table(["Invoice","Date","Customer","Items","Subtotal","Discount","Tax","Total","Payment","Receipt"],list.map(s=>`<tr><td>${esc(s.invoiceId)}</td><td>${esc(fmtDate(s.date))}</td><td>${esc(s.customerName||"Walk-in")}</td><td>${esc(s.itemCount)}</td><td>${money(s.subtotal)}</td><td>${money(s.discount)}</td><td>${money(s.tax)}</td><td><strong>${money(s.total)}</strong></td><td>${esc(s.paymentMethod)}</td><td><button class="secondary" onclick="reprintSale('${esc(s.id)}')">View</button></td></tr>`))}
function bindSalesFilter(){const run=()=>{const q=$("#salesSearch").value.toLowerCase(),from=$("#salesFrom").value,to=$("#salesTo").value;$("#salesTable").innerHTML=salesRows(state.sales.filter(s=>{const d=String(s.date||"").slice(0,10);return(!from||d>=from)&&(!to||d<=to)&&[s.invoiceId,s.customerName].some(v=>String(v||"").toLowerCase().includes(q))}))};["salesSearch","salesFrom","salesTo"].forEach(id=>$("#"+id).addEventListener("input",run))}
async function reprintSale(id){try{const d=await call("getSaleDetails",{id});showReceipt(d)}catch(e){toast(e.message,true)}}
function downloadSales(){const rows=[["Invoice","Date","Customer","Subtotal","Discount","Tax","Total","Payment"],...state.sales.map(s=>[s.invoiceId,s.date,s.customerName,s.subtotal,s.discount,s.tax,s.total,s.paymentMethod])];downloadCSV("sales.csv",rows)}
function downloadCSV(name,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function expensesPage(){return `<div class="card"><div class="toolbar"><input id="eSearch" placeholder="Search expenses"><button onclick="expenseForm()">+ Add expense</button></div><div id="expenseTable">${expenseRows(state.expenses)}</div></div>`}
function expenseRows(list){return table(["Date","Category","Description","Amount","Actions"],list.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td><td><button class="secondary" onclick="expenseForm('${esc(e.id)}')">Edit</button><button class="danger" onclick="deleteExpense('${esc(e.id)}')">Delete</button></td></tr>`))}
function bindExpenseFilter(){ $("#eSearch").oninput=()=>{const q=$("#eSearch").value.toLowerCase();$("#expenseTable").innerHTML=expenseRows(state.expenses.filter(e=>[e.category,e.description,e.date].some(v=>String(v||"").toLowerCase().includes(q))))}}
function expenseForm(id=""){const e=state.expenses.find(x=>x.id===id)||{};showForm(id?"Edit expense":"Add expense",field("Category","category",e.category||"General","text","required")+field("Amount","amount",e.amount??"","number",'min="0.01" step="0.01" required')+field("Date","date",e.date||dateNow(),"date","required")+`<div class="field wide"><label>Description</label><textarea name="description" rows="3">${esc(e.description||"")}</textarea></div>`,d=>call(id?"updateExpense":"saveExpense",{...d,id,amount:Number(d.amount)}))}
async function deleteExpense(id){if(confirm("Delete this expense?"))try{await call("deleteExpense",{id});await refresh();toast("Expense deleted.")}catch(e){toast(e.message,true)}}
function reportsPage(){return `<div class="card"><h3>Business reports</h3><div class="reportbar"><div class="field"><label>From</label><input id="rFrom" type="date" value="${new Date(Date.now()-6*86400000).toISOString().slice(0,10)}"></div><div class="field"><label>To</label><input id="rTo" type="date" value="${dateNow()}"></div><button onclick="runReports()">Generate reports</button></div><div id="reportResults">${reportContent(state.sales,state.expenses)}</div></div>`}
function reportContent(sales,expenses){const from=$("#rFrom")?.value||"0000-00-00",to=$("#rTo")?.value||"9999-99-99";const ss=sales.filter(s=>String(s.date).slice(0,10)>=from&&String(s.date).slice(0,10)<=to),ee=expenses.filter(e=>e.date>=from&&e.date<=to);const total=ss.reduce((a,s)=>a+num(s.total),0),cost=ss.reduce((a,s)=>a+num(s.estimatedCost),0),ex=ee.reduce((a,e)=>a+num(e.amount),0),pm={};ss.forEach(s=>pm[s.paymentMethod]=(pm[s.paymentMethod]||0)+num(s.total));const best={};ss.forEach(s=>(s.items||[]).forEach(i=>best[i.productName]=(best[i.productName]||0)+num(i.quantity)));return `<div class="grid">${metric("Sales",money(total),ss.length+" orders")}${metric("Expenses",money(ex),"Selected period")}${metric("Estimated profit",money(ss.reduce((a,s)=>a+num(s.total)-num(s.estimatedCost),0)-ex),"Revenue − item cost − expenses")}${metric("Average order",money(ss.length?total/ss.length:0),"Selected period")}</div><h3>Payment methods</h3>${table(["Method","Sales total"],Object.entries(pm).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`))}<h3>Best-selling products</h3>${table(["Product","Units sold"],Object.entries(best).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`))}<h3>Low stock products</h3>${table(["Product","Stock","Limit"],state.products.filter(p=>num(p.stock)<=num(p.lowStockLimit)).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.stock)}</td><td>${esc(p.lowStockLimit)}</td></tr>`))}<h3>Expenses</h3>${table(["Date","Category","Description","Amount"],ee.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td></tr>`))}<button onclick="downloadCSV('report.csv',[['Invoice','Date','Customer','Total','Payment'],...ss.map(s=>[s.invoiceId,s.date,s.customerName,s.total,s.paymentMethod])])">Export sales CSV</button>`}
function runReports(){$("#reportResults").innerHTML=reportContent(state.sales,state.expenses)}
function settingsPage(){const s=state.settings;const keys=[["businessName","Business name","text"],["businessCategory","Business category","text"],["currency","Currency code","text"],["currencySymbol","Currency symbol","text"],["address","Address","text"],["city","City","text"],["country","Country","text"],["phone","Phone","tel"],["email","Email","email"],["website","Website","url"],["logo","Logo URL","url"],["primaryColor","Primary color","color"],["taxRate","Tax rate (%)","number"],["receiptFooter","Receipt footer","text"]];return `<div class="card"><h3>Business configuration</h3><p class="muted">These values are stored in Google Sheets and drive branding, receipts and currency display.</p><form id="settingsForm"><div class="settingsgrid">${keys.map(([k,l,t])=>field(l,k,s[k]??(k==="primaryColor"?"#c33c9f":""),t,k==="taxRate"?'min="0" max="100" step=".01"':"")).join("")}<div class="field"><label class="checkrow"><input type="checkbox" name="taxEnabled" ${s.taxEnabled?"checked":""}> Enable tax</label></div>${["receiptShowAddress","receiptShowPhone","receiptShowEmail","receiptShowLogo"].map(k=>`<div class="field"><label class="checkrow"><input type="checkbox" name="${k}" ${s[k]!==false?"checked":""}> ${esc(k.replace("receiptShow","Show receipt "))}</label></div>`).join("")}</div><button type="submit">Save settings</button></form></div>`}
$("#app").addEventListener("submit",async e=>{if(e.target.id!=="settingsForm")return;e.preventDefault();const f=new FormData(e.target),data={};for(const k of ["businessName","businessCategory","currency","currencySymbol","address","city","country","phone","email","website","logo","primaryColor","receiptFooter"])data[k]=f.get(k)||"";data.taxRate=Number(f.get("taxRate")||0);data.taxEnabled=f.has("taxEnabled");for(const k of ["receiptShowAddress","receiptShowPhone","receiptShowEmail","receiptShowLogo"])data[k]=f.has(k);try{await call("saveSettings",data);await refresh();toast("Settings saved.")}catch(err){toast(err.message,true)}});
function assistantPage(){return `<div class="card"><h3>AI Business Assistant (optional)</h3><p>This POS works without AI. The secure AI integration should be implemented as a separate server-side endpoint, such as a Netlify Function, with the provider API key stored in Netlify environment variables.</p><p>You can review business summaries below without sending customer information to an AI provider.</p><button onclick="go('reports')">Open business reports</button><hr><h3>Quick summary</h3><p>Today's sales: <strong>${money(state.dashboard.todaySales)}</strong></p><p>Today's orders: <strong>${esc(state.dashboard.todayOrders||0)}</strong></p><p>Low-stock items: <strong>${esc(state.dashboard.lowStockCount||0)}</strong></p><p class="muted">No AI API key is required or stored in this frontend.</p></div>`}
async function start(){try{await refresh()}catch(e){$("#connection").textContent="● Connection failed";$("#connection").style.color="var(--danger)";$("#app").innerHTML=`<div class="card"><h2>POS connection setup</h2><p>${esc(e.message)}</p><p>Paste your deployed Google Apps Script Web App URL into GOOGLE_SCRIPT_URL at the top of this file, then reload.</p><button onclick="start()">Retry connection</button><p class="muted">If this is a new spreadsheet, run setupDatabase() from the Apps Script editor and authorize it first.</p></div>`}}
start();
</script>
</body>
</html>
